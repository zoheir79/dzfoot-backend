services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dzfoot
      POSTGRES_PASSWORD: dzfoot
      POSTGRES_DB: dzfoot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./init_db.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzfoot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  account:
    image: djdreamer79/dzfoot-backend-account:latest
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dzfoot:dzfoot@postgres:5432/dzfoot
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      SECRET_KEY: ${APP_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  session:
    image: djdreamer79/dzfoot-backend-session:latest
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dzfoot:dzfoot@postgres:5432/dzfoot
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GF_BINARY_PATH: /usr/local/bin/gf_server
      GF_SPAWN_MODE: ${GF_SPAWN_MODE:-local}
      STATS_SERVICE_URL: http://stats:8000
      CATALOG_URL: http://catalog:8000
      GF_CONFIG_DIR: /tmp/gf_configs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  matchmaking:
    image: djdreamer79/dzfoot-backend-matchmaking:latest
    ports:
      - "8003:8000"
    environment:
      REDIS_URL: redis://redis:6379
      SESSION_URL: http://session:8000
      ACCOUNT_URL: http://account:8000
    depends_on:
      redis:
        condition: service_healthy

  stats:
    image: djdreamer79/dzfoot-backend-stats:latest
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dzfoot:dzfoot@postgres:5432/dzfoot
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog:
    image: djdreamer79/dzfoot-backend-catalog:latest
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dzfoot:dzfoot@postgres:5432/dzfoot
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    image: djdreamer79/dzfoot-backend-admin:latest
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dzfoot:dzfoot@postgres:5432/dzfoot
      ADMIN_PORT: 8000
      ADMIN_SECRET: ${ADMIN_SECRET:-dzfoot-admin-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./admin/data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - account
      - session
      - matchmaking
      - stats
      - catalog
      - admin

networks:
  dzfoot-network:
    driver: bridge

volumes:
  pgdata:
