events {
    worker_connections 4096;
    use epoll;
}

http {
    upstream account_backend {
        least_conn;
        server account:8000;
    }
    upstream session_backend {
        least_conn;
        server session:8000;
    }
    upstream matchmaking_backend {
        least_conn;
        server matchmaking:8000;
    }
    upstream stats_backend {
        least_conn;
        server stats:8000;
    }
    upstream catalog_backend {
        least_conn;
        server catalog:8000;
    }

    server {
        listen 80;
        client_max_body_size 10M;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
        }

        # Account service
        location /auth/      { proxy_pass http://account_backend; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
        location /profile/   { proxy_pass http://account_backend; }
        location /friends/   { proxy_pass http://account_backend; }
        location /token/     { proxy_pass http://account_backend; }

        # Session service (internal + external)
        location /session/        { proxy_pass http://session_backend; }
        location /internal/       { proxy_pass http://session_backend; allow 10.0.0.0/8; deny all; }

        # Matchmaking
        location /queue/     { proxy_pass http://matchmaking_backend; }
        location /match/     { proxy_pass http://matchmaking_backend; }

        # Stats
        location /leaderboard/  { proxy_pass http://stats_backend; }
        location /stats/        { proxy_pass http://stats_backend; }
        location /matches/      { proxy_pass http://stats_backend; }
        location /history/      { proxy_pass http://stats_backend; }

        # Catalog
        location /teams       { proxy_pass http://catalog_backend; proxy_cache_valid 200 1h; }
        location /stadiums    { proxy_pass http://catalog_backend; proxy_cache_valid 200 1h; }
        location /players     { proxy_pass http://catalog_backend; proxy_cache_valid 200 1h; }
    }
}
